# Every push to main with a feat/fix/perf (or breaking) commit since the last
# v* tag publishes a release; the version comes from scripts/release-plan.sh.
# Every push to develop publishes a pre-release, vX.Y.Z-preview.<run number>,
# where X.Y.Z is the release develop would become.
# GitHub attaches the source code (zip + tar.gz) to every release automatically.
name: Release

on:
  push:
    branches: [main, develop]

permissions:
  contents: write

# pushes in quick succession release one after another, never in parallel
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          PREVIEW: ${{ github.ref_name == 'develop' && github.run_number || '' }}
        run: ./scripts/release-plan.sh dist/release-notes.md | tee -a "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: dist/release-notes.md

  build:
    needs: plan
    if: needs.plan.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-22.04
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml && rm Cargo.toml.bak

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/ez-notes \
            target/aarch64-apple-darwin/release/ez-notes \
            target/x86_64-apple-darwin/release/ez-notes
          BIN=dist/ez-notes ./scripts/bundle-macos.sh
          ditto -c -k --keepParent dist/Yana.app "Yana-$VERSION-${{ matrix.name }}.zip"

      - name: Build Windows exe
        if: runner.os == 'Windows'
        run: |
          cargo build --release
          mkdir pkg && cp target/release/ez-notes.exe pkg/Yana.exe && cp README.md pkg/
          7z a "Yana-$VERSION-${{ matrix.name }}.zip" ./pkg/*

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir yana && cp target/release/ez-notes yana/yana && cp README.md yana/
          tar czf "Yana-$VERSION-${{ matrix.name }}.tar.gz" yana

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: Yana-*

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # creates the tag on the built commit and a full (non-draft) release;
      # main becomes "Latest", develop is a pre-release that never does
      - name: Create release
        run: >
          gh release create "$TAG" Yana-*
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Yana $TAG" --notes-file release-notes.md
          ${{ github.ref_name == 'develop' && '--prerelease --latest=false' || '--latest' }}
